media:
  - name: images
    label: Görseller
    input: assets/images
    output: /assets/images
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]
    rename: safe

content:
  - name: posts
    label: Makaleler
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, categories, date]
      primary: title
      sort: [date, title]
      search: [title, description, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        type: string
        hidden: true
        default: post

      - name: title
        label: Makale başlığı
        type: string
        required: true
        description: Yazının başlığını gir.

      - name: description
        label: Kısa açıklama
        type: text
        description: Makale listesinde başlığın altında görünür.

      - name: date
        label: Yayın tarihi
        type: date
        required: true
        options:
          format: "yyyy-MM-dd"

      - name: categories
        label: Kategori
        type: select
        required: true
        options:
          multiple: true
          values:
            - Donanım
            - Siber Güvenlik
            - Yazılım
            - İşletim Sistemleri
            - Teknik Rehberler
            - Araştırma Notları

      - name: tags
        label: Etiketler
        type: string
        list: true

      - name: cover
        label: Kapak görseli
        type: image
        options:
          media: images
          path: posts
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

      - name: featured
        label: Ana sayfada öne çıkar
        type: boolean
        default: false

      - name: published
        label: false
        type: boolean
        hidden: true
        default: true

      - name: body
        label: Makale içeriği
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: images
          path: posts
          rename: safe

  - name: about
    label: Hakkımda sayfası
    type: file
    path: hakkimda.md
    format: code

  - name: site_config
    label: Site ayarları
    type: file
    path: _config.yml
    format: code

settings:
  content:
    merge: true
