media:
  - name: images
    label: Görseller
    input: assets/images
    output: /assets/images
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]
    rename: safe

content:
  - name: posts
    label: Makaleler
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false
    view:
      fields: [title, date, categories, published]
      primary: title
      sort: [date, title]
      search: [title, description, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        type: string
        hidden: true
        default: post

      - name: title
        label: Makale başlığı
        type: string
        required: true
        description: Makalenin başlığını yaz.

      - name: description
        label: Kısa açıklama
        type: text
        description: Makale listelerinde başlığın altında görünür.

      - name: body
        label: Makale içeriği
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: images
          path: posts
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

      - name: date
        label: Yayın tarihi
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss xx"

      - name: categories
        label: Kategoriler
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - Donanım
            - Siber Güvenlik
            - Yazılım
            - İşletim Sistemleri
            - Teknik Rehberler
            - Araştırma Notları

      - name: tags
        label: Etiketler
        type: string
        list: true
        description: Aralarında Enter tuşuna basarak birden fazla etiket ekleyebilirsin.

      - name: reading_time
        label: Okuma süresi
        type: string
        description: Örnek: 6 dk okuma. Boş bırakırsan sitede varsayılan süre gösterilir.

      - name: cover
        label: Kapak görseli
        type: image
        options:
          media: images
          path: posts
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

      - name: cover_alt
        label: Kapak görseli açıklaması
        type: string
        description: Görseli görmeyen kullanıcılar için kısa açıklama.

      - name: cover_caption
        label: Kapak görseli alt yazısı
        type: string
        description: Görselin altında gösterilecek isteğe bağlı metin.

      - name: featured
        label: Ana sayfada öne çıkar
        type: boolean
        default: false

      - name: published
        label: Yayınla
        type: boolean
        default: false
        description: Açık olduğunda makale sitede yayımlanır.

  - name: about
    label: Hakkımda sayfası
    type: file
    path: hakkimda.md
    format: code

  - name: site_config
    label: Site ayarları
    type: file
    path: _config.yml
    format: code

settings:
  content:
    merge: true
